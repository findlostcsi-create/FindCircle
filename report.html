<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report an Item | Find Circle</title><link rel="stylesheet" href="style.css"></head><body class="workspace-loading"><main class="wrap page-content"><span class="kicker">LOST IT || LIST IT || FIND IT</span><h1>Report an item</h1><p>Help the PICT community reconnect with belongings.</p><form id="reportForm" class="panel form-grid"><label>Report type<select id="type" required><option value="Lost">I lost an item</option><option value="Found">I found an item</option></select></label><label>Item title<input id="title" required maxlength="80" placeholder="e.g. Black wallet"></label><label>Category<select id="category" required></select></label><label>Campus location<select id="location" required></select></label><label>Date lost / found<input id="eventDate" type="date" required></label><label>Photo (optional, JPG/PNG/WebP, max 2 MB)<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="full">Public description<textarea id="description" rows="4" maxlength="600" required placeholder="Describe general appearance. For found items, keep identifying details private."></textarea></label><p class="full privacy-note">Never publish roll numbers, ID numbers, contact details, serial numbers or secret ownership clues. Photos are publicly accessible when uploaded.</p><div class="full"><button id="save" class="btn primary" type="submit">Publish report</button><p id="status" role="status" hidden></p></div></form></main><script type="module" src="report.js"></script><script type="module" src="app-shell.js"></script></body></html>
