<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | Find Circle</title><link rel="icon" type="image/png" href="./favicon.png"><link rel="icon" type="image/png" href="./favicon.png"><link rel="stylesheet" href="style.css"></head><body class="workspace-loading"><main class="wrap page-content"><span class="kicker">LOST IT || LIST IT || FIND IT</span><h1>Private messages</h1><p>Only you and the other participant can read this conversation.</p><div class="chat-layout"><aside class="panel"><h2>Conversations</h2><div id="threads">Loading…</div></aside><section class="panel"><h2 id="chatTitle">Select a conversation</h2><p id="chatContext" class="smallnote"></p><p id="chatPublicEmail" class="smallnote" hidden></p><div id="chatLog" class="chat-log" aria-live="polite"></div><form id="chatForm" class="chat-compose"><label class="sr-only" for="chatText">Your message</label><input id="chatText" maxlength="1000" placeholder="Write a message…" required disabled><button class="btn primary" id="sendBtn" disabled>Send</button></form><p class="smallnote" id="chatStatus" role="status"></p></section></div></main><script type="module" src="messages.js"></script><script type="module" src="app-shell.js"></script></body></html>
