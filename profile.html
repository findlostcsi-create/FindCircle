<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | Find Circle</title><link rel="icon" type="image/png" href="./favicon.png"><link rel="stylesheet" href="style.css"></head><body class="workspace-loading"><main class="wrap page-content"><span class="kicker">MY FIND CIRCLE</span><h1>My profile</h1><p>Manage your PICT student profile.</p><section class="panel profile-panel"><div class="profile-heading"><div class="profile-avatar" id="avatar" aria-hidden="true">◎</div><div><h2 id="profileName">Loading profile…</h2><p id="profileEmail"></p></div></div><form id="profileForm" class="form-grid"><label class="full" for="displayName">Full name<input id="displayName" required minlength="2" maxlength="100" autocomplete="name"></label><label class="full">Email address<input id="emailAddress" type="email" readonly></label><label class="full">College name<input value="PICT — Pune Institute of Computer Technology" readonly></label><label>Department / Branch<select id="branch" required><option value="">Select branch</option><option>Computer Engineering</option><option>Information Technology</option><option>Electronics and Telecommunication Engineering</option><option>Other</option></select></label><label>Academic year<select id="academicYear" required><option value="">Select year</option><option>First Year</option><option>Second Year</option><option>Third Year</option><option>Fourth Year</option></select></label><label class="full">Roll number<input id="rollNumber" required maxlength="25" autocomplete="off"></label><div class="full"><button class="btn primary" type="submit" id="saveProfile">Save changes</button></div></form><p id="profileStatus" role="status" aria-live="polite"></p><p class="privacy-note">Only your name is shared in messages. Your other student details remain private.</p></section></main><script type="module" src="profile.js"></script><script type="module" src="app-shell.js"></script></body></html>
